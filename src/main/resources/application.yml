spring:
  application:
    name: project-collab

  datasource:
    url: jdbc:h2:mem:collab;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
